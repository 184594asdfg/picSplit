<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼图边框模板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #ffffff;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .border-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .border-icon {
            width: 60px;
            height: 60px;
            border: 3px solid #7a7a7a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            color: #7a7a7a;
            position: relative;
        }

        .border-label {
            font-size: 20px;
            color: #7a7a7a;
            font-weight: 500;
        }

        /* 对角线精准连两角，无空隙 */
        .no-border-icon::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom right, transparent calc(50% - 1.5px), #7a7a7a calc(50% - 1.5px), #7a7a7a calc(50% + 1.5px), transparent calc(50% + 1.5px));
        }

        .small-border-icon::after {
            content: "S";
        }
        .medium-border-icon::after {
            content: "M";
        }
        .large-border-icon::after {
            content: "L";
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="border-item">
            <div class="border-icon no-border-icon"></div>
            <div class="border-label">无边框</div>
        </div>
        <div class="border-item">
            <div class="border-icon small-border-icon"></div>
            <div class="border-label">小边框</div>
        </div>
        <div class="border-item">
            <div class="border-icon medium-border-icon"></div>
            <div class="border-label">中边框</div>
        </div>
        <div class="border-item">
            <div class="border-icon large-border-icon"></div>
            <div class="border-label">大边框</div>
        </div>
    </div>
</body>
</html>
